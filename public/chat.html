<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>CHIMJA Assistant</title><link rel="stylesheet" href="/live.css?v=20261102c"></head><body data-widget="true"><dialog id="assistant" aria-labelledby="assistant-title">
<div class="dialog-head"><h2 id="assistant-title">CHIMJA Assistant</h2><button class="quiet" id="restart" type="button">New chat</button><button class="quiet" id="close" type="button" aria-label="Close assistant">✕</button></div>
<section id="chat-panel"><p id="submission-note" hidden role="status">Inquiry received. You can keep chatting.<br>To update your brief, reply to the acknowledgment email.</p><div id="conversation" role="log" aria-live="polite"><p class="bubble">Hi! Tell me what you’d like to build.</p></div><div id="composer"><form id="chat"><label class="sr" for="question">Your message</label><input id="question" placeholder="Tell us about your project…" maxlength="1800" autocomplete="off" required><button aria-label="Send message">↑</button></form><button class="quiet wide" id="intake" type="button">Review project details →</button><p id="chat-status" role="status"></p></div></section>
<section id="review-panel" hidden><form id="lead-form"><div class="review-fields"><button class="quiet" id="back-chat" type="button">← Back to chat</button><h3>Review your project</h3><p class="review-help">We’ve carried over your details. Edit anything before sending.</p><label for="lead-name">Name</label><input id="lead-name" name="name" required maxlength="80" autocomplete="name"><label for="lead-email">Email</label><input id="lead-email" name="email" type="email" required maxlength="254" autocomplete="email"><label for="lead-overview">Project brief</label><textarea id="lead-overview" name="overview" required minlength="10" maxlength="2000" rows="5"></textarea><label class="consent"><input type="checkbox" name="consent" required><span>I agree to receive an acknowledgment and up to two project follow-ups from CHIMJA. I can stop at any time.</span></label><label hidden aria-hidden="true">Leave blank<input name="companyWebsite" tabindex="-1" autocomplete="off"></label><div id="human-check"></div><p class="foot">Avoid sensitive information. <a href="/privacy/" target="_blank" rel="noopener">Privacy policy</a></p></div><div class="review-actions"><p id="review-status" role="status"></p><button id="submit-inquiry" type="submit">Send project inquiry</button></div></form></section></dialog><script type="module" src="/live.js?v=20261102c"></script></body></html>
